# 프록시 공통 헤더. 원서버는 X-Forwarded-For 로 클라이언트 IP 를 추정하고,
# 그 프리픽스가 큐 토큰 클레임에 박힌다(§4-L3). 여기서 값이 흔들리면
# 정상 사용자가 IP 불일치로 튕긴다.
#
# **X-Real-IP 에도 $sg_forwarded 를 넣는다.** 흔한 관용구인 `X-Real-IP $remote_addr`
# 는 여기서 틀린 값이다: $remote_addr 는 nginx 가 보는 직전 피어이고, 이 토폴로지에서
# 그것은 클라이언트가 아니라 부하 생성기(운영이라면 CDN 엣지)다. 게다가
# httpx.ClientIP 는 X-Real-IP 를 X-Forwarded-For 보다 **먼저** 보므로, 두 헤더가
# 어긋나면 조용히 틀린 쪽이 이긴다. 실제로 그렇게 전 참가자의 ip_prefix 가
# 하나(nginx 네트워크의 /24)로 접혀 §4-L5 의 "IP prefix 집중" 신호가
# 구분에 기여하지 못하면서 모두에게 균일하게 만점을 얹었다.
# 클라이언트 IP 에 대한 판단은 신뢰 경계(=이 프록시)에서 하나로 정하고,
# 그 하나를 두 헤더에 같이 실어 보낸다.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $sg_forwarded;
proxy_set_header X-Forwarded-For $sg_forwarded;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
