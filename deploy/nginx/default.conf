# 대기실 오리진 — §2 의 "CDN + WAF" 자리에 서는 컴포넌트다.
#
# 두 가지 일을 한다:
#   1. 대기실 정적 페이지 서빙. 백엔드가 전부 죽어도 이 페이지는 뜬다(§7 원서버 보호).
#   2. API 를 경로별로 원서버에 넘긴다. 브라우저 입장에서 전부 같은 오리진이라
#      CORS 도, 크로스 오리진 쿠키도 필요 없다 — SSE(EventSource)가 쿠키로
#      큐 토큰을 보낼 수 있는 이유가 이것이다.
#
# 업스트림 주소는 **요청마다 다시 해석한다.** upstream 블록에 호스트명을 쓰면
# nginx 가 기동 시점에 한 번만 DNS 를 풀고 그 IP 를 붙든다. 그러면 백엔드 컨테이너를
# 재생성할 때마다(설정 바꿔 재기동, 배포) IP 가 바뀌어 502 가 쏟아진다.
# 변수를 쓰면 resolver 를 거쳐 매번 해석하므로 백엔드가 자유롭게 뜨고 질 수 있다.

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 내장 DNS

map $http_x_forwarded_for $sg_forwarded {
  # 클라이언트가 보낸 X-Forwarded-For 를 그대로 신뢰한다 — **로컬 데모 전용**이다.
  # 부하 테스트가 IP 대역 분포를 흉내 낼 수 있어야 하기 때문이고, 운영에서는
  # 엣지가 이 헤더를 덮어써야 한다(안 그러면 IP 기반 신호를 클라이언트가 조작한다).
  ""      $remote_addr;
  default $http_x_forwarded_for;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 백엔드 주소. 변수로 두어야 요청 시점에 해석된다.
  set $sg_gate      gate:8080;
  set $sg_queue     queue:8081;
  set $sg_admission admission:8082;
  set $sg_shop      shop:8084;

  # 대기실 페이지는 자주 바뀌지 않지만, 데모에서 캐시가 걸리면 수정이 안 보인다.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # ── API 라우팅 ──────────────────────────────────────────────────────
  # 경로가 서비스별로 겹치지 않으므로 정확 매치로 나눈다.
  # /queue/enter 는 게이트고 /queue/status 는 큐 서비스다 — 접두사로 나누면 섞인다.

  location = /api/v1/queue/enter {
    proxy_pass http://$sg_gate$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }
  location = /api/v1/challenge/verify {
    proxy_pass http://$sg_gate$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }
  # greylist 에서 돌아 나오는 문(§4 재챌린지). 게이트가 챌린지 발급·검증을 모두
  # 들고 있으므로 여기에 붙는다. 라우트를 빠뜨리면 재검증 경로만 404 가 되는데,
  # 그때 사용자가 보는 것은 "확인 중"에서 영원히 멈춘 화면이다.
  location = /api/v1/challenge/reissue {
    proxy_pass http://$sg_gate$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }
  location = /api/v1/challenge/reverify {
    proxy_pass http://$sg_gate$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }
  location = /api/v1/queue/heartbeat {
    proxy_pass http://$sg_queue$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }
  location = /api/v1/admission/redeem {
    proxy_pass http://$sg_admission$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }
  location = /api/v1/orders {
    proxy_pass http://$sg_shop$request_uri;
    include /etc/nginx/sg_proxy.conf;
  }

  # 상태 조회는 SSE 다. 버퍼링을 끄지 않으면 프레임이 nginx 에 고여 순번이 멈춘 것처럼 보인다.
  location = /api/v1/queue/status {
    proxy_pass http://$sg_queue$request_uri;
    include /etc/nginx/sg_proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }
}
