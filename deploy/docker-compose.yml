# ShardGate 로컬 데모 스택 (DESIGN.md §8 / §10 Phase 0)
#
# 포트는 전부 127.0.0.1 에만 게시한다. Docker 의 포트 게시는 macOS 응용 프로그램
# 방화벽을 우회하므로, "0.0.0.0:6379" 는 방화벽이 켜져 있어도 인터넷에 열린다.
# 이 머신처럼 인터페이스에 공인 IP 가 직접 붙어 있으면 NAT 도 막아 주지 않는다.
# 다른 기기에서 붙어야 하면 SSH 터널을 쓰고, 바인드 주소를 바꾸지 않는다.
#
# 주의: 여기 있는 키 값은 전부 "로컬 데모 전용" 더미다.
# 운영에서는 SG_EVENT_SALT / SG_TOKEN_SIGNING_KEY / SG_CHALLENGE_HMAC_KEY 를
# 시크릿 매니저에서 주입해야 한다. event_salt 는 오픈 전까지 비공개여야 한다(§3.1).

name: shardgate

x-common-env: &common-env
  SG_LOG_LEVEL: ${SG_LOG_LEVEL:-info}
  SG_REDIS_ADDRS: redis:6379
  SG_REDIS_PASSWORD: ${SG_REDIS_PASSWORD:-shardgate-local-dev}
  SG_KAFKA_BROKERS: kafka:9092
  SG_KAFKA_TOPIC: ${SG_KAFKA_TOPIC:-shardgate.telemetry}
  SG_POSTGRES_DSN: postgres://shardgate:shardgate@postgres:5432/shardgate?sslmode=disable
  SG_EVENT_ID: ${SG_EVENT_ID:-demo}
  SG_EVENT_SALT: ${SG_EVENT_SALT:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
  SG_TOKEN_SIGNING_KEY: ${SG_TOKEN_SIGNING_KEY:-a0a1a2a3a4a5a6a7a8a9aaabacadaeafb0b1b2b3b4b5b6b7b8b9babbbcbdbebf}
  SG_CHALLENGE_HMAC_KEY: ${SG_CHALLENGE_HMAC_KEY:-c0c1c2c3c4c5c6c7c8c9cacbcccdcecfd0d1d2d3d4d5d6d7d8d9dadbdcdddedf}
  # 로컬 데모는 평문 http 라 Secure 쿠키를 붙이면 브라우저가 저장하지 않는다.
  # 운영에서는 절대 끄지 않는다(기본값이 true).
  SG_SECURE_COOKIE: ${SG_SECURE_COOKIE:-false}
  SG_SHARD_SIZE: ${SG_SHARD_SIZE:-1000}
  SG_SHARD_COUNT: ${SG_SHARD_COUNT:-16}
  # 오픈 시각(RFC3339). **비워 두면 추첨 구간이 통째로 꺼진다** — enqueue.lua 가
  # lottery_end=0 을 받아 전원을 FIFO 밴드에 넣는다. §3.2 의 공정성 모델을 켜려면
  # 반드시 준다. (§11 측정을 이 값 없이 한 번 돌려서 추첨 구간이 꺼진 줄 모르고
  # 결과를 읽은 적이 있다 — docs/REPORT.md §3.4)
  SG_EVENT_OPEN_AT: ${SG_EVENT_OPEN_AT:-}
  SG_LOTTERY_WINDOW: ${SG_LOTTERY_WINDOW:-2m}
  SG_ADMIT_RATE_PER_MIN: ${SG_ADMIT_RATE_PER_MIN:-3000}
  SG_ADMIT_INTERVAL: ${SG_ADMIT_INTERVAL:-5s}
  # 추첨 구간이 닫힐 때까지 입장을 열지 않는다. 탐지에 시간을 벌어 주는 대신
  # 전체 대기 시간이 그만큼 늘어난다(DESIGN.md §3.4, REPORT.md §3.4).
  SG_ADMIT_AFTER_LOTTERY: ${SG_ADMIT_AFTER_LOTTERY:-false}
  # 사용자별 최소 관찰 게이트. 진입 후 이만큼 지나기 전에는(또는 생존 신호가 이만큼
  # 쌓이기 전에는) 순번이 와도 입장시키지 않는다. 위와 목적은 같고 재는 기준이 다르다 —
  # 이쪽은 각자의 진입 시각부터 재므로 늦게 온 사람도 똑같이 관찰되고, 예산을 건드리기
  # 전에 판단하므로 자리가 사라지지 않는다. 값의 근거는 격리 P90(REPORT.md §3.5).
  SG_ADMIT_MIN_DWELL: ${SG_ADMIT_MIN_DWELL:-0s}
  SG_ADMIT_MIN_BEATS: ${SG_ADMIT_MIN_BEATS:-0}
  # 재챌린지(§4 greylist 복귀). 통과해도 점수를 0 으로 되돌리지 않고 임계 직하로
  # 클램프하며, 허용 횟수를 넘겨 오면 보류로 올린다. 값의 근거는 config.BotScore 주석.
  # 이 둘은 위 게이트와 달리 **기본값이 켜져 있다** — 꺼진 상태(재검증 없음)가
  # greylist 를 출구 없는 종점으로 만들기 때문이고, 그건 고치려던 결함 그 자체다.
  SG_RECHALLENGE_PASS_SCORE: ${SG_RECHALLENGE_PASS_SCORE:-35}
  SG_RECHALLENGE_MAX_ATTEMPTS: ${SG_RECHALLENGE_MAX_ATTEMPTS:-2}
  # PoW 난이도. 기본값은 코드 기본값과 같다.
  # 부하 테스트에서는 낮춰야 한다 — 16비트면 클라이언트가 진입마다 평균 65,536회
  # 해시를 돌고, 부하 생성기가 CPU 에 묶이면 heartbeat 간격이 봇도 사람도 똑같이
  # 불규칙해져 규칙성 신호가 사라진다(docs/REPORT.md §3 주의사항).
  SG_POW_BASE_DIFFICULTY: ${SG_POW_BASE_DIFFICULTY:-16}
  SG_POW_MAX_DIFFICULTY: ${SG_POW_MAX_DIFFICULTY:-26}
  # 의심도 1회당 올리는 난이도 폭(비트). 재챌린지 회차 상향도 이 값을 쓴다.
  # **여기 없으면 부하 시나리오에서 이 값을 조절할 수 없다.** 실제로 그렇게 한 번
  # 측정했다 — 스윕 스크립트가 0 을 export 했는데 compose 가 그 이름을 모르니
  # 컨테이너는 코드 기본값 4 로 떴고, 아무것도 실패하지 않은 채 팔이 조용히 바뀌었다.
  # ROADMAP 결함 6 과 같은 종류다: 빠진 것은 코드가 아니라 배포가 값을 주는 일이다.
  SG_GREYLIST_DIFFICULTY_BUMP: ${SG_GREYLIST_DIFFICULTY_BUMP:-4}
  # 상대 신호의 기준선을 평균/표준편차 대신 중앙값/MAD 로 잡는다(REPORT §3.12).
  # 기본 켬 — 부하 두 팔에서 재고 켰다(§3.13 탐지율 +12.8pp / §3.14 손해 없음).
  # 끄면 §3.1~§3.12 의 표를 만든 체제로 돌아간다.
  SG_SCORE_ROBUST_BASELINE: ${SG_SCORE_ROBUST_BASELINE:-true}

x-service-defaults: &service-defaults
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    # 브로커가 살아 있는 것과 토픽이 있는 것은 다른 얘기다. 아래 kafka-init 참고.
    kafka-init:
      condition: service_completed_successfully

services:
  redis:
    image: redis:8-alpine
    # 인증을 켠다. 개발용 스택이라도 인증 없는 Redis 는 CONFIG SET dir + SAVE 로
    # 파일을 쓸 수 있는 원격 실행 통로다 — 실제로 스캐너가 몇 분 만에 찾아온다.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${SG_REDIS_PASSWORD:-shardgate-local-dev}
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SG_REDIS_PASSWORD:-shardgate-local-dev}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shardgate
      POSTGRES_PASSWORD: shardgate
      POSTGRES_DB: shardgate
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # PG 18 부터 데이터 디렉터리는 /var/lib/postgresql 아래의 버전별 하위 폴더다.
      # 예전처럼 /var/lib/postgresql/data 에 볼륨을 붙이면 기동을 거부한다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shardgate -d shardgate"]
      interval: 3s
      timeout: 2s
      retries: 20

  # KRaft 단일 브로커. 파티션 수는 샤드 수 상한과 일치시킨다(CLAUDE.md Working Notes).
  kafka:
    image: apache/kafka:4.2.0
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${SG_SHARD_COUNT:-16}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # 토픽을 **미리** 만든다. 자동 생성은 첫 produce 때 일어나는데, 그때까지 스코어러가
  # 기다려 주지 않는다 — 없는 토픽에 컨슈머 그룹으로 조인하면 파티션을 0개 배정받고
  # 그대로 Stable 이 된다. 그 뒤 토픽이 생겨도 리밸런스할 이유가 없어 영원히 0개다.
  #
  # 브로커에 볼륨이 없어서 `docker compose down` 마다 토픽이 사라지므로, 이 경합은
  # 스택을 내렸다 올릴 때마다 재현된다. 아무것도 실패하지 않고 탐지만 꺼지기 때문에
  # 로그로는 알 수 없다(docs/ROADMAP.md 결함 7).
  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    # 파티션 수 = 샤드 수 상한 (CLAUDE.md Working Notes).
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${SG_KAFKA_TOPIC:-shardgate.telemetry}
      - --partitions
      - "${SG_SHARD_COUNT:-16}"
    restart: "no"

  gate:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: gate
    environment:
      <<: *common-env
      SG_HTTP_ADDR: ":8080"
    ports: ["127.0.0.1:8080:8080"]

  queue:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: queue
    environment:
      <<: *common-env
      SG_HTTP_ADDR: ":8081"
    ports: ["127.0.0.1:8081:8081"]

  admission:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: admission
    environment:
      <<: *common-env
      SG_HTTP_ADDR: ":8082"
      SG_SHOP_HEALTH_URL: http://shop:8084/healthz
    ports: ["127.0.0.1:8082:8082"]

  scorer:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: scorer
    environment:
      <<: *common-env
      SG_HTTP_ADDR: ":8083"
    ports: ["127.0.0.1:8083:8083"]

  shop:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: shop
    environment:
      <<: *common-env
      SG_HTTP_ADDR: ":8084"
    ports: ["127.0.0.1:8084:8084"]

  # 대기실 오리진. 실제 운영에서는 CDN + WAF 가 이 역할을 한다(§2, §7 원서버 보호).
  # 정적 페이지를 서빙하고 API 를 경로별로 원서버에 넘긴다 — 브라우저에게는
  # 전부 같은 오리진이라 SSE 가 쿠키로 큐 토큰을 실어 보낼 수 있다.
  web:
    image: nginx:1.29-alpine
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/sg_proxy.conf:/etc/nginx/sg_proxy.conf:ro
    ports: ["127.0.0.1:8088:80"]
    depends_on: [gate, queue, admission, shop]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 관측 도구는 로컬에서 다른 것과 포트가 겹치기 쉽다. 기본값은 그대로 두고
    # 필요할 때만 옮길 수 있게 한다.
    ports: ["127.0.0.1:${SG_PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${SG_GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
